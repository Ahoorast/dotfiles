# hyprlock - https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 6
}

# password input box
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    outer_color = rgba(100, 114, 125, 0.6)
    inner_color = rgba(43, 48, 59, 0.8)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password</span>
    check_color = rgba(61, 174, 233, 1.0)
    fail_color = rgba(235, 77, 75, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

# big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = Noto Sans Mono
    color = rgba(255, 255, 255, 0.9)
    position = 0, 120
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Noto Sans Mono
    color = rgba(200, 200, 200, 0.8)
    position = 0, 50
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    font_size = 14
    color = rgba(180, 180, 180, 0.7)
    position = 0, 10
    halign = center
    valign = center
}
